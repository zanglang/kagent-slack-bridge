# Reference. Real copy in k8s-at-home repo: kagent/manifests/externalsecret-slack.yaml
# Add these to Doppler yourself (per repo policy):
#   KAGENT_SLACK_BOT_TOKEN   -> xoxb-... (Bot User OAuth Token)
#   KAGENT_SLACK_APP_TOKEN   -> xapp-... (App-Level Token, connections:write)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-slack-bridge
  namespace: kagent
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: doppler
    kind: ClusterSecretStore
  target:
    name: kagent-slack-bridge
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: KAGENT_SLACK_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: KAGENT_SLACK_APP_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
